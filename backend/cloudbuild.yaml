steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bazmart-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bazmart-backend:latest'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bazmart-backend:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bazmart-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bazmart-backend:$COMMIT_SHA'
      - '--region'
      - 'me-west1' # Middle East (Tel Aviv / Dammam) region for ultra-low latency to Iraq
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '4001'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=4001'

images:
  - 'gcr.io/$PROJECT_ID/bazmart-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/bazmart-backend:latest'

